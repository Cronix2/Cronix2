
name: Update TryHackMe Badge

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: [self-hosted, linux, ARM64, thm-badge]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/checkout@v4
        with:
          repository: KeizerSec/Tryhackme-Badge
          ref: v2.0.0
          path: .badge-generator
          persist-credentials: false

      - name: Generate badge
        env:
          THM_USERNAME: Cronix3
          THEME: midnight
          OUTPUT_PATH: assets/thm_badge.svg
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install -q curl_cffi
          node .badge-generator/src/generate.js

      - name: Publish badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thm_badge.svg
          git diff --cached --quiet || (git commit -m "Update TryHackMe badge" && git push)
