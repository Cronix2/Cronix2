
name: Update TryHackMe Badge

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tryhackme-badge
  cancel-in-progress: false

jobs:
  update-badge:
    runs-on: [self-hosted, linux, ARM64, thm-badge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate TryHackMe badge
        uses: KeizerSec/Tryhackme-Badge@v2.0.0
        with:
          username: Cronix3
          theme: midnight
          output_path: assets/thm_badge.svg
